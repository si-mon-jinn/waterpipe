[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "waterpipe"
version = "1.0.0"
description = "Evaluation pipeline for LLM watermark detection experiments"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Simone Ceppi" },
]
keywords = ["watermark", "llm", "evaluation", "pipeline", "nlp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "openai>=1.0.0",
    "tqdm>=4.65.0",
    "sbw>=1.0.0",
]

[project.optional-dependencies]
metrics = [
    "bert-score>=0.3.13",
]
attacks = [
    "nltk>=3.8.0",
]
all = [
    "waterpipe[metrics,attacks]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
waterpipe = "waterpipe.__main__:main"

[project.urls]
Homepage = "https://github.com/si-mon-jinn/waterpipe"
Documentation = "https://github.com/si-mon-jinn/waterpipe#readme"
Repository = "https://github.com/si-mon-jinn/waterpipe"

[tool.hatch.build.targets.wheel]
packages = ["waterpipe"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
